name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: codebase-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Byte-compile
        run: python -m compileall -q cli config code_parser embedding retrieval cache agent web analysis evaluation scripts

      - name: Fast unit tests
        run: pytest -q -m "not slow"