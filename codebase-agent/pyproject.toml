[project]
name = "codebase-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.25.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
codebase-agent = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["codebase_agent", "codebase_agent.*", "config", "config.*", "cli", "cli.*", "code_parser", "code_parser.*", "embedding", "embedding.*", "retrieval", "retrieval.*", "cache", "cache.*", "agent", "agent.*", "tests", "tests.*"]